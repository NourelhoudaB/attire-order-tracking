<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TENUE PRO · Suivi de chaîne</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;600;700&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F5F4F2;--card:#fff;--tx:#1C1C1E;--mut:#6B6B70;--line:#E2E0DC;--red:#C8102E;--ora:#B45309;--blu:#1D4ED8;--grn:#15803D;--blk:#444;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141414;--card:#1E1E1F;--tx:#F2F2F2;--mut:#A0A0A5;--line:#333;--red:#E5384F;--ora:#F59E0B;--blu:#6EA0FF;--grn:#4ADE80;--blk:#BBB}}
:root[data-theme="dark"]{--bg:#141414;--card:#1E1E1F;--tx:#F2F2F2;--mut:#A0A0A5;--line:#333;--red:#E5384F;--ora:#F59E0B;--blu:#6EA0FF;--grn:#4ADE80;--blk:#BBB}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 Barlow,system-ui,sans-serif}
header{background:var(--red);color:#fff;padding:10px 14px;display:flex;justify-content:space-between;align-items:center;gap:8px}
header h1{margin:0;font:700 21px 'Barlow Condensed',Barlow,sans-serif}
header button{background:rgba(255,255,255,.2);color:#fff;border:0;border-radius:8px;padding:8px 12px;font:inherit;min-height:40px}
.hl{display:flex;align-items:center;gap:10px}.hl img{height:42px;background:#fff;border-radius:8px;padding:3px}
nav{display:flex;gap:6px;overflow-x:auto;padding:10px 12px;background:var(--card);border-bottom:1px solid var(--line)}
nav button{flex:none;min-height:44px;padding:0 16px;border:1px solid var(--line);background:var(--bg);color:var(--tx);border-radius:22px;font:600 15px Barlow,sans-serif}
nav button.on{background:var(--red);border-color:var(--red);color:#fff}
main{max-width:1000px;margin:0 auto;padding:14px}
h2{font:700 22px 'Barlow Condensed',Barlow,sans-serif;margin:18px 0 10px}
.sm{color:var(--mut);font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px}
.card.c-o{border-left-color:var(--ora)}.card.c-b{border-left-color:var(--blu)}.card.c-g{border-left-color:var(--grn)}.card.c-r{border-left-color:var(--red)}
.oh{display:flex;justify-content:space-between;gap:10px;cursor:pointer}.cl{font-size:20px}
.chip{font:600 13px Barlow,sans-serif;padding:3px 10px;border-radius:12px;background:color-mix(in srgb,currentColor 12%,transparent);white-space:nowrap;height:fit-content}
.c-o{color:var(--ora)}.c-b{color:var(--blu)}.c-g{color:var(--grn)}.c-r{color:var(--red)}
.card.c-o,.card.c-b,.card.c-g,.card.c-r{color:var(--tx)}
.bar{height:8px;background:var(--line);border-radius:4px;margin:8px 0 4px;overflow:hidden}.bar i{display:block;height:100%;background:var(--grn)}
button.pri{background:var(--red);color:#fff;border:0;border-radius:10px;min-height:46px;padding:0 18px;font:700 16px Barlow,sans-serif}
button.sec{background:var(--bg);color:var(--tx);border:1px solid var(--line);border-radius:10px;min-height:44px;padding:0 14px;font:600 15px Barlow,sans-serif}
input,select,textarea{width:100%;min-height:44px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--tx);font:inherit}
label{display:block;font-size:14px;color:var(--mut);margin:8px 0 3px}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px}
.todo{border:2px solid var(--red);border-radius:12px;padding:12px;margin:10px 0}
.ck{display:flex;gap:12px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}
.tick{flex:none;width:48px;height:48px;border-radius:12px;border:2px solid var(--red);background:var(--card);color:var(--red);font-size:26px;line-height:1}
.tick.on{background:var(--grn);border-color:var(--grn);color:#fff}.tick:disabled:not(.on){border-color:var(--line);color:var(--mut)}
.msg{border-left:4px solid var(--blu)}.msg.al{border-left-color:var(--red)}.msg.un{background:color-mix(in srgb,var(--blu) 8%,var(--card))}
.login{max-width:360px;margin:6vh auto;padding:20px}.login img{display:block;width:170px;max-width:70%;margin:0 auto 10px;background:#fff;border-radius:12px;padding:6px}
.toast{position:fixed;left:12px;right:12px;bottom:calc(14px + env(safe-area-inset-bottom,0px));background:var(--tx);color:var(--bg);padding:12px;border-radius:10px;z-index:9}
.search{font-size:18px;min-height:52px}
</style>
</head>

<div id="app"></div>
<div id="toast" class="toast" style="display:none"></div>

var FN={manager:'Manager',traceur:'Traceur',magasin:'Magasin tissu',coupe:'Coupe',etiq:'Étiquetage',chaine:'Chaîne de confection',broderie:'Broderie',graphiste:'Graphiste logo',dtf:'Impression DTF',emb:'Emballage',liv:'Livraison',lect:'Consultation',admin:'Administrateur'};
var OWN={'Sortie trace':'traceur','Confirmation trace':'manager','Sortie tissu':'magasin','Coupe':'coupe','Étiquetage':'etiq','Confection':'chaine','Broderie faite':'broderie','Sortie logo':'graphiste','Logo imprimé':'dtf','Emballage':'emb','Sortie à livrer':'liv'};
var WHY={'Sortie trace':'Sortir le tracé','Confirmation trace':'Confirmer le tracé','Sortie tissu':'Sortir le tissu à utiliser','Coupe':'Couper','Étiquetage':'Étiqueter les pièces','Confection':'Confection en chaîne','Broderie faite':'Broderie à réaliser','Sortie logo':'Sortir le logo','Logo imprimé':'Imprimer le logo en DTF','Emballage':'Emballer','Sortie à livrer':'Sortir pour livraison'};
var KEY='tp_chain_v1',PK='tp_chain_pw';
var S={orders:[],msgs:[],seq:1},PW={};
try{var r1=localStorage.getItem(KEY);if(r1){S=JSON.parse(r1);}var r2=localStorage.getItem(PK);if(r2){PW=JSON.parse(r2);}}catch(err){}
var cur=null,tab='today',openId=null,q='',replyTo='all',live=false,docRef=null,busy=false,dirty=false;

function push(){
if(!docRef)return;
if(busy){dirty=true;return;}
busy=true;dirty=false;
docRef.set({json:JSON.stringify(S)}).then(function(){busy=false;if(dirty)push();},function(){busy=false;});
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(err){}push();}
function e(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function hash(s){var h=5381;for(var i=0;i<s.length;i++){h=((h<<5)+h+s.charCodeAt(i))|0;}return String(h);}
function toast(m){var t=document.getElementById('toast');t.textContent=m;t.style.display='block';setTimeout(function(){t.style.display='none';},2800);}
function role(){return cur||'';}
function isMgr(){return cur==='manager'||cur==='admin';}
function canStep(st){return cur==='admin'||OWN[st]===cur;}
function ord(id){return S.orders.filter(function(o){return o.id===id;})[0];}
function today(){return new Date().toISOString().slice(0,10);}
function now(){return new Date().toLocaleString('fr-FR');}
function note(to,text,ref,kind){
S.msgs.unshift({t:now(),fromR:kind==='alerte'?'':cur,to:to,text:text,ref:ref||'',kind:kind||'msg',r:{}});
if(S.msgs.length>300){S.msgs.length=300;}
}
function unread(){
return S.msgs.filter(function(m){return (m.to===cur||m.to==='all')&&!m.r[cur]&&m.fromR!==cur;}).length;
}
function buildSteps(o){
var s=['Sortie trace','Confirmation trace','Sortie tissu','Coupe','Étiquetage','Confection'];
if(o.perso==='broderie'){s.push('Broderie faite');}
if(o.perso==='dtf'){s.push('Sortie logo','Logo imprimé');}
s.push('Emballage','Sortie à livrer');return s;
}
function stat(o){
if(o.status==='livree'){return {c:'c-g',l:'✅ LIVRÉE'};}
if(o.status==='importee'){return {c:'c-o',l:'🟠 À PLANIFIER'};}
if(o.steps[o.si]==='Sortie à livrer'){return {c:'c-g',l:'🟢 PRÊTE À LIVRER'};}
return {c:'c-b',l:'🔵 EN COURS'};
}

/* ---------- actions ---------- */
function doLogin(){
var f=document.getElementById('lf').value,pw=document.getElementById('lp').value,er=document.getElementById('lerr');
var st=PW[f];
if(!st){
if(pw.length<4){er.textContent='Première connexion : choisissez un mot de passe (4 caractères minimum).';return;}
PW[f]=hash(pw);try{localStorage.setItem(PK,JSON.stringify(PW));}catch(err){}
}else if(st!==hash(pw)){er.textContent='Mot de passe incorrect.';return;}
cur=f;tab='today';render();
}
function logout(){cur=null;render();}
function go(t){tab=t;render();}
function tog(id){openId=(openId===id)?null:id;render();}
function upd(id,k,v){
if(!isMgr()){return toast('Action non autorisée pour votre rôle');}
var o=ord(id);if(!o||o.status!=='importee')return;
o[k]=v;save();
}
function importCsv(){
if(!isMgr()){return toast('Action non autorisée pour votre rôle');}
var lines=document.getElementById('csv').value.split(/\r?\n/),n=0;
lines.forEach(function(l,i){
l=l.trim();if(!l)return;
var c=l.split(/[;\t,]/).map(function(x){return x.trim();});
if(i===0&&/ref|commande|n°/i.test(c[0]))return;
if(!c[0]||!c[1])return;
if(S.orders.some(function(o){return o.ref===c[0];}))return;
var p=(c[5]||'').toLowerCase();
S.orders.push({id:S.seq++,ref:c[0],client:c[1],prod:c[2]||'',qty:parseInt(c[3],10)||0,tissu:c[4]||'',metres:'',perso:p.indexOf('brod')>=0?'broderie':(p.indexOf('dtf')>=0?'dtf':''),status:'importee',steps:null,si:0,done:[]});
n++;
});
if(!n){return toast('Aucune nouvelle commande importée.');}
document.getElementById('csv').value='';save();render();toast(n+' commande(s) importée(s).');
}
function readFile(inp){
var f=inp.files[0];if(!f)return;
var rd=new FileReader();
rd.onload=function(){document.getElementById('csv').value=String(rd.result);};
rd.readAsText(f);
}
function rank(o){return (o.express?2:0)+(o.prio?1:0);}
function rup(id,on){
if(!isMgr()){return toast('Action non autorisée pour votre rôle');}
var o=ord(id);if(!o||o.status!=='importee')return;
o.rupture=on;
note('magasin',on?'Rupture de stock : '+(o.manque||'à préciser')+' — '+o.ref+' ('+o.client+')':'Rupture levée — '+o.ref+' ('+o.client+')',o.ref,'alerte');
save();render();
}
function plan(id){
if(!isMgr()){return toast('Action non autorisée pour votre rôle');}
var o=ord(id);if(!o||o.status!=='importee')return;
if(!o.tissu){return toast('Indiquez le tissu à utiliser.');}
if(o.rupture){return toast('En rupture de stock : levez la rupture avant de planifier.');}
o.status='planifiee';o.plan=today();o.steps=buildSteps(o);o.si=0;o.done=[];
note('traceur',(o.express?'⚡ EXPRESS · ':'')+'À vous : Sortie trace — '+o.ref+' ('+o.client+')',o.ref,'alerte');
save();render();toast(o.ref+' ajoutée au planning du jour.');
}
function unplan(id){
if(!isMgr()){return toast('Action non autorisée pour votre rôle');}
var o=ord(id);if(!o||o.status!=='planifiee'||o.si>0){return toast('Retrait impossible : une étape est déjà faite.');}
o.status='importee';o.steps=null;o.plan=null;save();render();
}
function tick(id){
var o=ord(id);if(!o||o.status!=='planifiee')return;
var st=o.steps[o.si];
if(!canStep(st)){return toast('Action non autorisée pour votre rôle');}
o.done[o.si]=now()+' · '+FN[cur];
o.si++;
if(o.si>=o.steps.length){
o.status='livree';
note('manager','Commande livrée : '+o.ref+' ('+o.client+')',o.ref,'alerte');
}else{
var nx=o.steps[o.si];
note(OWN[nx],(o.express?'⚡ EXPRESS · ':'')+'À vous : '+nx+' — '+o.ref+' ('+o.client+')',o.ref,'alerte');
}
save();render();
}
function sendMsg(){
if(cur==='lect'){return toast('Action non autorisée pour votre rôle');}
var to=document.getElementById('mt').value,tx=document.getElementById('mx').value.trim(),rf=document.getElementById('mr').value.trim();
if(!tx){return toast('Écrivez un message.');}
note(to,tx,rf,'msg');replyTo='all';save();render();toast('Message envoyé.');
}
function reply(r){replyTo=r;render();window.scrollTo(0,0);}

/* ---------- views ---------- */
function checklist(o){
return o.steps.map(function(x,i){
var d=i<o.si,c=i===o.si&&o.status==='planifiee',ok=c&&canStep(x);
var sub=d?'Fait · '+e(o.done[i]||''):(c?(ok?'À faire · '+e(WHY[x]):'En attente · '+e(FN[OWN[x]])):'Verrouillé : « '+e(o.steps[i-1])+' » pas encore faite');
return '<div class="ck"><button class="tick'+(d?' on':'')+'" '+(ok?'onclick="tick('+o.id+')"':'disabled')+'>'+(d?'☑':'☐')+'</button><div><b>'+e(x)+'</b><div class="sm">'+sub+'</div></div></div>';
}).join('');
}
function card(o,f){
var s=stat(o),st=o.steps?o.steps[o.si]:'';
var h='<div class="card '+s.c+'"><div class="oh" onclick="tog('+o.id+')"><div><b class="cl">'+e(o.client)+'</b><div class="sm">'+e(o.ref)+' · '+e(o.prod)+(o.qty?' × '+o.qty:'')+'</div><div class="sm">Tissu : '+e(o.tissu||'—')+(o.metres?' · '+e(o.metres)+' m':'')+(o.perso?' · '+e(o.perso):'')+'</div></div><div style="display:flex;flex-direction:column;gap:4px;align-items:flex-end"><span class="chip '+s.c+'">'+s.l+'</span>'+(o.express?'<span class="chip c-r">⚡ EXPRESS</span>':(o.prio?'<span class="chip c-r">PRIORITAIRE</span>':''))+(o.rupture?'<span class="chip c-r">🔴 RUPTURE : '+e(o.manque||'à préciser')+'</span>':'')+'</div></div>';
if(o.status==='planifiee'){h+='<div class="bar"><i style="width:'+Math.round(o.si/o.steps.length*100)+'%"></i></div><div class="sm">Étape : <b>'+e(st)+'</b> · '+o.si+'/'+o.steps.length+' · Responsable : '+e(FN[OWN[st]])+'</div>';}
if(o.steps&&(f||openId===o.id)){h+='<div style="margin-top:8px">'+checklist(o)+'</div>';}
return h+'</div>';
}
function head(){
var n=unread();
return '<header><span class="hl"><img src="'+LOGO+'" alt="Tenue Pro"><h1>TENUE PRO</h1></span><span class="sm" style="color:#fff;text-align:right">'+e(FN[cur])+'<br>'+(live?'● partagé':'○ cet appareil')+'</span><button onclick="go(\'msg\')">🔔 '+n+'</button><button onclick="logout()">Quitter</button></header>';
}
function nav(){
var t=[['today','Aujourd’hui'],['follow','Suivi']];
if(isMgr()){t.splice(1,0,['prep','Planning']);}
t.push(['msg','Messages'+(unread()?' ('+unread()+')':'')]);
return '<nav>'+t.map(function(x){return '<button class="'+(tab===x[0]?'on':'')+'" onclick="go(\''+x[0]+'\')">'+x[1]+'</button>';}).join('')+'</nav>';
}
function loginHtml(){
return '<div class="login"><img src="'+LOGO+'" alt="Tenue Pro"><p class="sm" style="text-align:center">Suivi de chaîne · connexion par fonction</p><label>Fonction</label><select id="lf">'+Object.keys(FN).map(function(k){return '<option value="'+k+'">'+e(FN[k])+'</option>';}).join('')+'</select><label>Mot de passe</label><input id="lp" type="password" onkeydown="if(event.key===\'Enter\')doLogin()"><p id="lerr" class="c-r" style="min-height:22px"></p><button class="pri" style="width:100%" onclick="doLogin()">Se connecter</button><p class="sm">Première connexion : le mot de passe saisi devient celui de cette fonction sur cet appareil.</p></div>';
}
function render(){
var app=document.getElementById('app');
if(!cur){app.innerHTML=loginHtml();return;}
var v=tab==='prep'?prepV():(tab==='follow'?followV():(tab==='msg'?msgV():todayV()));
app.innerHTML=head()+nav()+'<main>'+v+'</main>';
}
function todayV(){
var d=today();
var pl=S.orders.filter(function(o){return o.status==='planifiee';});
pl.sort(function(a,b){return rank(b)-rank(a);});
var mine=pl.filter(function(o){return canStep(o.steps[o.si]);});
var h='<h2>⚡ À faire maintenant · '+e(FN[cur])+'</h2>';
if(!mine.length){h+='<p class="sm">Aucune action requise actuellement.</p>';}
mine.forEach(function(o){var st=o.steps[o.si];h+='<div class="todo"><b>'+e(st)+'</b> — '+e(o.ref)+' · '+e(o.client)+'<div class="sm">'+e(WHY[st])+(o.tissu?' · Tissu : '+e(o.tissu):'')+'</div><div style="margin-top:8px"><button class="pri" onclick="tick('+o.id+')">☑ FAIT</button></div></div>';});
h+='<h2>Planning du jour · '+d+'</h2>';
if(!pl.length){h+='<p class="sm">Aucune commande au planning. Le manager prépare le planning.</p>';}
pl.forEach(function(o){h+=card(o,true);});
return h;
}
function prepV(){
var h='<h2>Importer les commandes confirmées</h2><div class="card"><p class="sm">Une ligne par commande : N° commande ; client ; produit ; quantité ; tissu ; personnalisation (broderie / dtf / vide).</p><textarea id="csv" rows="4" placeholder="TP-101;Restaurant Sidi;Veste chef blanc;20;Gabardine blanc;dtf"></textarea><div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px"><input type="file" accept=".csv,.txt" onchange="readFile(this)" style="flex:1;min-width:180px"><button class="pri" onclick="importCsv()">Importer</button></div></div>';
h+='<h2>Préparer le planning du jour</h2>';
var l=S.orders.filter(function(o){return o.status==='importee';});
l.sort(function(a,b){return rank(b)-rank(a);});
if(!l.length){h+='<p class="sm">Aucune commande à planifier.</p>';}
l.forEach(function(o){
h+='<div class="card c-o"><b class="cl">'+e(o.client)+'</b><div class="sm">'+e(o.ref)+' · '+e(o.prod)+(o.qty?' × '+o.qty:'')+'</div><div style="display:flex;gap:16px;flex-wrap:wrap;margin:10px 0"><label style="display:flex;gap:8px;align-items:center;margin:0;color:var(--tx)"><input type="checkbox" style="width:24px;min-height:24px"'+(o.prio?' checked':'')+' onchange="upd('+o.id+',\'prio\',this.checked)"> Prioritaire</label><label style="display:flex;gap:8px;align-items:center;margin:0;color:var(--tx)"><input type="checkbox" style="width:24px;min-height:24px"'+(o.express?' checked':'')+' onchange="upd('+o.id+',\'express\',this.checked)"> ⚡ Chaîne express</label><label style="display:flex;gap:8px;align-items:center;margin:0;color:var(--tx)"><input type="checkbox" style="width:24px;min-height:24px"'+(o.rupture?' checked':'')+' onchange="rup('+o.id+',this.checked)"> 🔴 Rupture de stock</label></div><label>Ce qui manque en stock</label><input value="'+e(o.manque||'')+'" placeholder="Ex. tissu gabardine blanc, 12 m" onchange="upd('+o.id+',\'manque\',this.value)"><div class="row"><div><label>Tissu à utiliser</label><input value="'+e(o.tissu)+'" onchange="upd('+o.id+',\'tissu\',this.value)"></div><div><label>Métrage (m)</label><input type="number" inputmode="decimal" value="'+e(o.metres)+'" onchange="upd('+o.id+',\'metres\',this.value)"></div><div><label>Personnalisation</label><select onchange="upd('+o.id+',\'perso\',this.value)"><option value=""'+(o.perso===''?' selected':'')+'>Aucune</option><option value="broderie"'+(o.perso==='broderie'?' selected':'')+'>Broderie</option><option value="dtf"'+(o.perso==='dtf'?' selected':'')+'>DTF</option></select></div></div><div style="margin-top:10px"><button class="pri" onclick="plan('+o.id+')">Ajouter au planning du jour</button></div></div>';
});
var pl=S.orders.filter(function(o){return o.status==='planifiee'&&o.si===0;});
if(pl.length){h+='<h2>Au planning, pas encore démarrées</h2>';pl.forEach(function(o){h+='<div class="card c-b"><b>'+e(o.client)+'</b> <span class="sm">'+e(o.ref)+'</span><div style="margin-top:8px"><button class="sec" onclick="unplan('+o.id+')">Retirer du planning</button></div></div>';});}
return h;
}
function followV(){
var ql=q.trim().toLowerCase();
var l=S.orders.filter(function(o){return !ql||o.ref.toLowerCase().indexOf(ql)>=0||o.client.toLowerCase().indexOf(ql)>=0;});
var h='<h2>🔎 Suivi des commandes</h2><input class="search" placeholder="N° commande ou client" value="'+e(q)+'" oninput="q=this.value;var x=document.getElementById(\'fl\');if(x){x.innerHTML=fol();}"><div id="fl" style="margin-top:10px">'+fol()+'</div>';
return h;
}
function fol(){
var ql=q.trim().toLowerCase();
var l=S.orders.filter(function(o){return !ql||o.ref.toLowerCase().indexOf(ql)>=0||o.client.toLowerCase().indexOf(ql)>=0;});
if(!l.length){return '<p>Aucune commande trouvée.</p>';}
return l.slice().reverse().map(function(o){return card(o,false);}).join('');
}
function msgV(){
var mine=S.msgs.filter(function(m){return m.to===cur||m.to==='all'||m.fromR===cur;});
var h='<h2>Nouveau message</h2>';
if(cur==='lect'){h+='<p class="sm">La consultation ne permet pas d’envoyer de message.</p>';}
else{h+='<div class="card"><div class="row"><div><label>À</label><select id="mt"><option value="all"'+(replyTo==='all'?' selected':'')+'>Tous</option>'+Object.keys(FN).filter(function(k){return k!==cur;}).map(function(k){return '<option value="'+k+'"'+(replyTo===k?' selected':'')+'>'+e(FN[k])+'</option>';}).join('')+'</select></div><div><label>N° commande (facultatif)</label><input id="mr"></div></div><label>Message</label><textarea id="mx" rows="3"></textarea><div style="margin-top:8px"><button class="pri" onclick="sendMsg()">Envoyer</button></div></div>';}
h+='<h2>Alertes et messages</h2>';
if(!mine.length){h+='<p class="sm">Aucun message.</p>';}
var chg=false;
mine.slice(0,60).forEach(function(m){
var un=(m.to===cur||m.to==='all')&&!m.r[cur]&&m.fromR!==cur;
h+='<div class="card msg '+(m.kind==='alerte'?'al':'')+(un?' un':'')+'"><div class="sm">'+(m.kind==='alerte'?'🔔 Alerte':'✉ '+e(FN[m.fromR]||m.fromR))+' → '+(m.to==='all'?'Tous':e(FN[m.to]))+' · '+e(m.t)+(m.ref?' · '+e(m.ref):'')+'</div>'+e(m.text)+(m.fromR&&m.fromR!==cur&&cur!=='lect'?'<div style="margin-top:6px"><button class="sec" onclick="reply(\''+m.fromR+'\')">Répondre</button></div>':'')+'</div>';
if(un){m.r[cur]=1;chg=true;}
});
if(chg){setTimeout(function(){save();},0);}
return h;
}
render();

/* ---------- données partagées ---------- */
if(window.claude&&claude.use){
claude.use('db').then(function(db){
if(!db)return;
live=true;docRef=db.doc('app/state');
docRef.onSnapshot(function(snap){
if(!snap.exists){if(S.orders.length||S.msgs.length){push();}if(cur)render();return;}
var d=snap.data();
if(!d||!d.json||busy||dirty||d.json===JSON.stringify(S))return;
try{S=JSON.parse(d.json);}catch(err){return;}
S.orders=S.orders||[];S.msgs=S.msgs||[];S.seq=S.seq||1;
try{localStorage.setItem(KEY,JSON.stringify(S));}catch(err){}
var a=document.activeElement;
if(cur&&!(a&&(a.tagName==='INPUT'||a.tagName==='TEXTAREA'||a.tagName==='SELECT'))){render();}
},function(){});
if(cur)render();
},function(){});
}
</script>
</body>
</html>
