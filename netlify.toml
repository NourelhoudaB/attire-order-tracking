[build]
  command = "npm run build"
  publish = "apps/web/dist"
[build.environment]
  NODE_VERSION = "24"
[server]
  path = "/api/*"
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; worker-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'"
    Referrer-Policy = "same-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  external_node_modules = ["argon2"]
[[redirects]]
  from = "/planning"
  to = "/index.html"
  status = 200
[[redirects]]
  from = "/suivi"
  to = "/index.html"
  status = 200
[[redirects]]
  from = "/messages"
  to = "/index.html"
  status = 200
[[redirects]]
  from = "/administration"
  to = "/index.html"
  status = 200
